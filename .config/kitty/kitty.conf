shell /usr/bin/zsh

font_family JetBrainsMono Nerd Font
font_size 12.0

scrollback_indicator none

tab_bar_style hidden
tab_bar_min_tabs 999

linux_display_server wayland
enable_wayland_window_decorations no

background_opacity 0.8
background_blur 1

window_padding_width 10

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

cursor #ffffff
cursor_text_color #000000

cursor_beam_thickness 5
cursor_underline_thickness 2

foreground #c0caf5
background #1a1b26
selection_foreground #1a1b26
selection_background #7aa2f7

color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5


